function vehXlsx(list,unitLabel){var L=list.slice().sort(plateCmp);
  var rows=L.map(function(v,i){return[i+1,v.p||"",v.b||"",v.u||"",v.k||"",v.tab||""]});
  var title="Список техніки — "+(unitLabel||"")+" — "+(D.date||"")+" ("+L.length+" од.)";
  var blob=xlsxBlob(title,["№","Номер","Марка","Підрозділ","Тип","АТ / БТ"],rows,[6,16,34,30,20,9]);
  var nm="Техніка_"+String(unitLabel||"").replace(/[\\\/:*?"<>|·]+/g," ").replace(/\s+/g,"_").replace(/^_+|_+$/g,"").slice(0,60)+"_"+String(D.date||"").replace(/\./g,"-")+".xlsx";
  var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=nm;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1000);
  return{url:url,name:nm,n:L.length}}
function xlBtn(list,unitLabel){var w=document.createElement("div");w.style.cssText="display:flex;flex-direction:column;gap:6px";
  w.innerHTML='<button type="button" class="xlb" style="text-align:left;padding:16px 18px;border:1px solid #39d353;border-radius:14px;background:#39d35326;color:#39d353;font:inherit;cursor:pointer"><b style="font-size:17px">⬇ Завантажити список техніки</b><br><span style="font-size:13px;opacity:.85">Excel-файл: номер, марка, підрозділ, тип — від меншого номера до більшого ('+list.length+' од.)</span></button><div class="xle" style="font-size:13px"></div>';
  w.querySelector(".xlb").onclick=function(){var e=w.querySelector(".xle");try{var r=vehXlsx(list,unitLabel);e.innerHTML='Файл «'+esc(r.name)+'» ('+r.n+' од.). Якщо завантаження не почалось — <a href="'+r.url+'" download="'+esc(r.name)+'" style="color:inherit">натисніть тут</a>'}catch(x){e.textContent="Не вдалося сформувати файл: "+x}};
  return w}
})();
